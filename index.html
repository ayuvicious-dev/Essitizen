<style>
:root{
  --pad:18px;--side:0px;
  --bg:#F4F7FC;--card:#FFFFFF;--ink:#0F1B33;--mut:#5B6B86;--blue:#0B4FB3;--onblue:#FFFFFF;
  --sky:#DCE8FA;--line:#E1E8F4;--ok:#1F8F63;--warn:#C97A12;--bad:#D14343;--field:#F4F7FC;
  --head:'Bricolage Grotesque','Figtree',system-ui,sans-serif;--body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
:root[data-t="dark"]{
  --bg:#0A1224;--card:#121C33;--ink:#E8EEFA;--mut:#93A3C2;--blue:#5B97FF;--onblue:#08142B;
  --sky:#1C2D50;--line:#22304F;--ok:#4CC893;--warn:#F0A64A;--bad:#FF7A7A;--field:#0D162B;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:left}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--head);margin:0;letter-spacing:-.01em;line-height:1.15}
.view{max-width:560px;margin:0 auto;padding:calc(22px + env(safe-area-inset-top)) var(--pad) calc(112px + env(safe-area-inset-bottom))}
.h1{font-size:30px;font-weight:700}
.sub{color:var(--mut);margin:6px 0 0}
.stick{position:sticky;top:0;z-index:15;background:var(--bg);margin:calc(-22px - env(safe-area-inset-top)) calc(-1 * var(--pad)) 0;padding:calc(20px + env(safe-area-inset-top)) var(--pad) 10px;border-bottom:1px solid transparent;transition:border-color .2s}
.scrolled .stick{border-bottom-color:var(--line)}
.stick+.sub{margin-top:2px}
.backb{flex:none;width:40px;height:40px;border-radius:50%;background:var(--sky);color:var(--blue);font-size:24px;line-height:1;display:grid;place-items:center}
.cpage-h{display:flex;align-items:center;gap:12px}
.chd{display:flex;align-items:center;gap:12px;min-width:0}
.chd .flag{flex:none}
.chd .h1{font-size:24px;line-height:1.15}
.chd small{display:block;color:var(--mut);font-size:13px}
.fic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:21px;margin-bottom:6px;background:color-mix(in srgb,var(--acc,var(--blue)) 16%,var(--card))}
.fx-info{--acc:var(--blue)}.fx-prog{--acc:#17A2A2}.fx-lang{--acc:var(--warn)}.fx-fin{--acc:var(--ok)}.fx-reg{--acc:#8A5CF6}.fx-doc{--acc:var(--mut)}
.frow{display:flex;gap:8px;align-items:center;margin-top:8px}
.frow input[type=text]{flex:1.5;min-width:0}.frow input[type=number]{flex:1;min-width:0}
.rhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.rhead span{display:flex;align-items:center;gap:2px}
.fav{color:var(--mut);font-size:22px;line-height:1;padding:2px 6px}.fav.on{color:var(--warn)}
.tblw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.cmp{border-collapse:separate;border-spacing:0;min-width:760px;width:100%;font-size:13.5px;line-height:1.4}
.cmp th,.cmp td{padding:11px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.cmp thead th{font-size:12.5px;color:var(--mut);font-weight:600;background:var(--card);white-space:nowrap}
.cmp tbody th{min-width:128px;font-weight:400;position:sticky;left:0;background:var(--card);z-index:1;box-shadow:1px 0 0 var(--line)}
.cmp thead th:first-child{position:sticky;left:0;z-index:2;box-shadow:1px 0 0 var(--line)}
.cmp th small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.cmp tr:last-child th,.cmp tr:last-child td{border-bottom:0}
.cmp td:nth-child(2){min-width:150px}.cmp td:nth-child(4),.cmp td:nth-child(5){min-width:190px}
.cmp .cg td{background:var(--sky);color:var(--blue);font-weight:700;font-size:12.5px;padding:0}
.cmp .cgl{position:sticky;left:0;display:inline-block;padding:7px 12px}
.lvl{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.lv-ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.lv-warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.lv-mut{background:var(--sky);color:var(--mut)}
.goldit{padding:10px 0;border-bottom:1px solid var(--line)}.goldit:last-child{border-bottom:0;padding-bottom:0}.goldit:first-child{padding-top:0}
.goldit select{flex:1;min-width:0}
.goldsum{padding:10px 0;border-bottom:1px solid var(--line)}.goldsum:last-child{border-bottom:0;padding-bottom:0}.goldsum:first-child{padding-top:0}
.spr{display:grid;grid-template-columns:1fr 84px 84px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.spr:last-of-type{border-bottom:0}.spr>span{display:flex;flex-direction:column;gap:2px;min-width:0}.spr small{font-size:12px;line-height:1.35}
.spr-h{border-bottom:0;padding:0 0 4px;font-size:12.5px;font-weight:600;color:var(--mut)}.spr-h span{text-align:center}
.sugrow{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.sugrow:first-child{padding-top:0}.sugrow:last-child{border-bottom:0;padding-bottom:0}
.stick .seg{margin-top:12px}
.sec{font-size:19px;font-weight:700;margin:30px 0 12px;display:flex;justify-content:space-between;align-items:baseline}
.sec small{font-family:var(--body);font-weight:500;font-size:14px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}
.card+.card{margin-top:12px}
.muted{color:var(--mut)}
.small{font-size:14px}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.bar nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.bar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--mut);font-size:11.5px;font-weight:500;border-radius:14px}
.bar button svg{width:26px;height:26px;padding:3px 14px;box-sizing:content-box;border-radius:14px;transition:background .2s}
.bar button[aria-current="page"]{color:var(--blue);font-weight:600}
.bar button[aria-current="page"] svg{background:var(--sky)}

/* hero ring */
.hero{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center;margin-top:20px}
.ring{width:150px;height:150px}
.rt{fill:none;stroke:var(--sky);stroke-width:11}
.rv{fill:none;stroke:var(--blue);stroke-width:11;stroke-linecap:round}
.rv.anim{animation:rv 1.3s cubic-bezier(.2,.7,.2,1) both}
@keyframes rv{from{stroke-dashoffset:var(--C)}}
.rn{font-family:var(--head);font-weight:700;font-size:30px;fill:var(--ink)}
.rl{font-size:11px;fill:var(--mut)}
.mini{display:block;width:100%;padding:7px 0}
.mini+.mini{border-top:1px solid var(--line)}
.mini .top{display:flex;justify-content:space-between;font-weight:600;font-size:14.5px}
.mini .top span:last-child{color:var(--mut);font-weight:500}
.pg{height:8px;border-radius:99px;background:var(--sky);overflow:hidden;margin-top:6px}
.pg i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .4s}
.pg.ok i{background:var(--ok)}

/* country */
.focus{display:flex;gap:14px;align-items:center;width:100%}
.flag{font-size:34px;line-height:1;width:46px;text-align:center}
.cinfo{flex:1;min-width:0;display:flex;flex-direction:column}
.cinfo b{font-weight:600}
.cinfo small{color:var(--mut);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow{display:flex;align-items:center;gap:10px;width:100%;padding:12px 4px;border-bottom:1px solid var(--line)}
.crow:last-of-type{border-bottom:0}
.flag img{width:38px;height:27px;object-fit:cover;border-radius:5px;display:block;margin:0 auto;box-shadow:0 0 0 1px var(--line)}
.flag .fc{font-family:var(--head);font-weight:700;font-size:18px}
.gh{font-family:var(--head);font-size:15px;font-weight:700;color:var(--mut);margin:18px 0 2px}
.folders{display:grid;grid-template-columns:1fr 1fr;gap:20px 14px;margin-top:18px}
.span-all{column-span:all}
.folder{--fc:color-mix(in srgb,var(--acc,var(--blue)) 36%,var(--bg));display:block;position:relative;width:100%;text-align:left;padding-top:0}
.f-Riset{--acc:var(--mut)}.f-Rencana{--acc:var(--blue)}.f-Proses{--acc:#17A2A2}.f-Diajukan{--acc:var(--warn)}.f-Disetujui{--acc:var(--ok)}
.fback{position:absolute;left:0;right:0;top:11px;bottom:0;background:var(--fc);border-radius:0 18px 18px 18px}
.ftab{position:absolute;left:0;top:0;width:52%;height:22px;background:var(--fc);border-radius:11px 0 0 0;isolation:isolate;font-style:normal;font-size:11.5px;font-weight:600;line-height:22px;padding-left:11px;color:var(--ink);white-space:nowrap}
.ftab::after{content:"";position:absolute;right:-9px;top:0;bottom:0;width:22px;background:var(--fc);transform:skewX(28deg);border-radius:0 8px 0 0;z-index:-1}
.fbody{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:3px;margin-top:20px;background:var(--card);border-radius:14px 14px 18px 18px;padding:14px 14px 14px;min-height:130px;box-shadow:0 -1px 0 color-mix(in srgb,var(--ink) 10%,transparent),0 8px 16px -8px rgba(11,40,90,.22);transition:transform .15s}
.fbody .flag{width:auto;text-align:left;margin-bottom:6px}
.fbody .flag img{margin:0}
.fbody b{font-weight:600;font-size:16px;line-height:1.25}
.fbody small{color:var(--mut);font-size:13px;line-height:1.35;margin-bottom:auto}
.fbody .chip{margin-top:10px}
.folder:active .fbody{transform:translateY(2px)}
.star{color:var(--warn);font-size:18px}
.chip{display:inline-block;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--sky);color:var(--blue);white-space:nowrap}
.chip.s-Diajukan{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.chip.s-Disetujui{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.chip.s-Riset{background:var(--line);color:var(--mut)}
.note{background:var(--sky);border-radius:16px;padding:14px 16px;font-size:14.5px}
.note b{font-weight:600}

/* tasks */
.task{display:flex;gap:12px;align-items:flex-start;width:100%;padding:11px 2px;border-bottom:1px solid var(--line)}
.task:last-of-type{border-bottom:0}
.cb{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--mut);display:grid;place-items:center;margin-top:1px;transition:.15s}
.cb svg{width:14px;height:14px;opacity:0;stroke:var(--onblue)}
.task.done .cb{background:var(--blue);border-color:var(--blue)}
.task.done .cb svg{opacity:1}
.task.done .tt{color:var(--mut);text-decoration:line-through}
.task .tt{flex:1}
.x{flex:none;color:var(--mut);font-size:20px;line-height:1;padding:2px 6px;border-radius:8px}
.trow{display:flex;align-items:center;width:100%}
.trow .task{flex:1;border-bottom:0}
.trow{border-bottom:1px solid var(--line)}
.trow:last-of-type{border-bottom:0}
.addrow{display:flex;gap:8px;margin-top:12px}

/* forms */
.fld{display:block;margin-top:14px}
.fld>span{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],select,textarea{width:100%;background:var(--field);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font-size:16px;min-height:48px}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:14px;background:var(--blue);color:var(--onblue);font-weight:600;text-align:center}
.btn.block{display:flex;width:100%}
.btn.ghost{background:var(--sky);color:var(--blue)}
.btn.danger{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.btn.sm{min-height:40px;padding:0 14px;font-size:14.5px}
.btn:active{transform:scale(.98)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sky);border-radius:16px;padding:4px;margin-top:18px}
.seg button{padding:10px 4px;text-align:center;border-radius:12px;font-weight:600;font-size:15px;color:var(--mut)}
.seg button[aria-selected="true"]{background:var(--card);color:var(--blue);box-shadow:0 1px 3px rgba(11,40,90,.12)}
input[type=range]{width:100%;accent-color:var(--blue);height:32px}
.rg{display:flex;align-items:center;gap:12px}
.rg b{width:44px;text-align:right;font-variant-numeric:tabular-nums;font-size:14.5px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--mut)}
.kv span:last-child{font-weight:600;text-align:right}
.big{font-family:var(--head);font-size:34px;font-weight:700;line-height:1.1}

/* mood */
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.moods button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0;border-radius:14px;background:var(--field);border:1.5px solid var(--line);font-size:26px}
.moods button small{font-size:11.5px;color:var(--mut)}
.moods button[aria-pressed="true"]{border-color:var(--blue);background:var(--sky)}
.week{display:flex;align-items:flex-end;gap:8px;height:90px;margin-top:16px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:5px;font-size:12px;color:var(--mut)}
.week i{width:100%;max-width:34px;border-radius:8px 8px 4px 4px;background:var(--blue);min-height:4px}
.week i.e{background:var(--sky)}

/* sheet & toast */
.scrim{position:fixed;inset:0;background:rgba(8,16,36,.5);z-index:40;animation:fade .2s}
.sheet{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:41;width:min(92vw,400px);max-height:78vh;overflow:hidden;display:flex;flex-direction:column;background:var(--card);border-radius:24px;padding:0;box-shadow:0 20px 60px rgba(8,16,36,.35);animation:pop .22s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{display:none}
.shead{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 14px 12px 18px;border-bottom:1px solid var(--line);min-height:68px}
.shead h2{margin:0;font-size:22px;min-width:0}
.sbody{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:12px 18px 18px}
.sx{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:22px;line-height:1;color:var(--mut);background:var(--field)}
.sheet .kv span:first-child{white-space:nowrap}
.sheet h2{font-size:22px;margin-bottom:4px}
@keyframes pop{from{transform:translate(-50%,-47%) scale(.96);opacity:0}}
@keyframes fade{from{opacity:0}}
.pick{display:flex;align-items:center;gap:12px;width:100%;padding:12px 4px;border-bottom:1px solid var(--line)}
.pick{align-items:flex-start}
.pick .cinfo small{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.4;margin-top:2px}
.pick .flag{padding-top:3px}
.pick .cinfo small.dualn{color:var(--blue)}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;font-size:14.5px;z-index:60;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}

/* auth */
.auth{max-width:440px;margin:0 auto;padding:calc(40px + env(safe-area-inset-top)) 22px 40px;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.auth img{width:84px;height:84px;border-radius:24px}
.auth h1{font-size:34px;font-weight:700;margin-top:18px}
.err{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad);border-radius:12px;padding:10px 14px;margin-top:14px;font-size:14.5px}
.link{color:var(--blue);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.splash{min-height:100vh;display:grid;place-items:center}
.splash img{width:84px;height:84px;border-radius:24px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.92);opacity:.7}}
/* responsif: tablet & desktop */
@media (min-width:600px){
  .view{max-width:680px;--pad:24px}
  .bar nav{max-width:680px}
}
@media (min-width:900px){
  :root{--side:240px;--pad:40px}
  html,body{font-size:16.5px}
  .view{max-width:1080px;width:calc(100% - var(--side));margin:0 0 0 calc(var(--side) + max(0px, (100vw - var(--side) - 1080px) / 2));padding:calc(30px + env(safe-area-inset-top)) var(--pad) 70px}
  .stick{margin-top:-30px;padding-top:30px}
  .bar{top:0;right:auto;bottom:0;width:var(--side);border-top:0;border-right:1px solid var(--line);padding:26px 14px;backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--card);overflow-y:auto}
  .bar::before{content:"Esitizen";display:block;font-family:var(--head);font-weight:700;font-size:23px;line-height:36px;color:var(--blue);margin:0 0 22px 14px;padding-left:46px;background:url("data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%20512%20512%22%3E%3Cdefs%3E%3ClinearGradient%20id=%22g%22%20x1=%220%22%20y1=%220%22%20x2=%221%22%20y2=%221%22%3E%3Cstop%20offset=%220%22%20stop-color=%22%232F7BF0%22/%3E%3Cstop%20offset=%221%22%20stop-color=%22%230B4FB3%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width=%22512%22%20height=%22512%22%20rx=%22116%22%20fill=%22url(%23g)%22/%3E%3Cg%20fill=%22none%22%20stroke=%22%23fff%22%20stroke-width=%2222%22%20stroke-linecap=%22round%22%3E%3Ccircle%20cx=%22246%22%20cy=%22242%22%20r=%22138%22/%3E%3Cellipse%20cx=%22246%22%20cy=%22242%22%20rx=%2260%22%20ry=%22138%22/%3E%3Cpath%20d=%22M108%20242h276M128%20170h236M128%20314h236%22/%3E%3C/g%3E%3Ccircle%20cx=%22372%22%20cy=%22372%22%20r=%2274%22%20fill=%22%230B4FB3%22/%3E%3Ccircle%20cx=%22372%22%20cy=%22372%22%20r=%2262%22%20fill=%22%23fff%22/%3E%3Cpath%20d=%22M342%20374l22%2022%2040-46%22%20fill=%22none%22%20stroke=%22%230B4FB3%22%20stroke-width=%2222%22%20stroke-linecap=%22round%22%20stroke-linejoin=%22round%22/%3E%3C/svg%3E") no-repeat left center/36px 36px}
  .bar nav{max-width:none;margin:0;grid-template-columns:1fr;gap:6px}
  .bar button{flex-direction:row;gap:14px;padding:11px 14px;font-size:15.5px;border-radius:14px;text-align:left}
  .bar button svg{padding:0;width:24px;height:24px;background:none!important}
  .bar button:hover{background:var(--field)}
  .bar button[aria-current="page"]{background:var(--sky)}
  .cols{column-count:2;column-gap:36px}
  .cols>*{break-inside:avoid}
  .cols>.sec{break-after:avoid}
  .cols>.span-all{column-span:all}
  .folders{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:24px 18px}
  .hero{grid-template-columns:170px 1fr}.ring{width:170px;height:170px}
  .sheet{width:min(92vw,480px)}
  #toast{bottom:28px;left:calc(50% + var(--side) / 2)}
}
@media (min-width:1280px){.cols{column-gap:48px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:370px){.hero{grid-template-columns:1fr;justify-items:center}.hero>div:last-child{width:100%}}
.jp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.jp-k{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px;border-radius:16px;background:var(--field);border:1px solid var(--line);color:var(--ink,inherit)}
.jp-k b{font-size:30px;font-weight:600;line-height:1.1}.jp-k span{font-size:13px;color:var(--mut)}
.jp-k.on{border-color:var(--blue);background:var(--sky)}
.jp-ph{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.jp-ph:last-child{border-bottom:0}.jp-ph b{font-size:18px;font-weight:600}
.jp-pad{position:relative;width:100%;max-width:320px;aspect-ratio:1;margin:14px auto;border-radius:20px;background:var(--field);border:1px dashed var(--line);overflow:hidden}
.jp-guide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:200px;color:var(--mut);opacity:.28;pointer-events:none;user-select:none}
.jp-nog .jp-guide{display:none}
.jp-pad canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.jp-q{font-size:56px;font-weight:600;text-align:center;margin:8px 0 16px}.jp-q.sm{font-size:26px}
.jp-opt{display:block;width:100%;text-align:left;min-height:48px;padding:10px 16px;margin-top:8px;border-radius:14px;background:var(--field);border:1px solid var(--line);font-weight:600;color:inherit}
.jp-opt.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);border-color:var(--ok)}
.jp-opt.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);border-color:var(--bad)}
.jp-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

const taskPct = (t) => pct(t.filter((x) => x.done).length, t.length);
function weekStart() { const d = new Date(); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return ymd(d); }
function weekMinutes() { const w = weekStart(); return data.prep.lang.log.filter((l) => l.d >= w).reduce((a, l) => a + l.m, 0); }
function readiness() {
  const L = data.prep.lang, F = data.prep.fin, M = data.prep.mental;
  const skills = Math.round(Object.values(L.skills).reduce((a, b) => a + b, 0) / 4);
  const lang = Math.round((skills + taskPct(L.tasks)) / 2);
  const fin = Math.round((pct(F.saved, F.goal) + taskPct(F.tasks)) / 2);
  const last = M.moods.slice(-7);
  const moodP = last.length ? Math.round((last.reduce((a, b) => a + b.v, 0) / last.length / 5) * 100) : taskPct(M.tasks);
  const men = Math.round((taskPct(M.tasks) + moodP) / 2);
  return { lang, fin, men, all: Math.round((lang + fin + men) / 3) };
}

function vFin() {
  const F = data.prep.fin, tot = F.costs.reduce((a, c) => a + c.amt, 0), paid = F.costs.filter((c) => c.paid).reduce((a, c) => a + c.amt, 0);
  const p = pct(F.saved, F.goal), left = Math.max(0, F.goal - F.saved);
  let eta = '';
  if (F.goal > 0 && left === 0) eta = 'Target tabungan tercapai 🎉';
  else if (F.goal > 0 && F.monthly > 0) { const m = Math.ceil(left / F.monthly), d = new Date(); d.setMonth(d.getMonth() + m); eta = `Perkiraan tercapai ${d.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' })} (${m} bulan)`; }
  else if (F.goal > 0) eta = 'Isi setoran bulanan untuk melihat perkiraan waktu.';
  return `<div class="sec">Tabungan <small>${data.currency}</small></div><div class="card">
    <div class="big">${fmtMoney(F.saved)}</div><p class="small muted" style="margin:4px 0 8px">${F.goal ? `${p}% dari target ${fmtMoney(F.goal)}` : 'Tetapkan target tabungan di bawah'}</p>${progress(p, p >= 100)}
    ${eta ? `<p class="small" style="margin:10px 0 0">${eta}</p>` : ''}
    ${field('Target dana', 'prep.fin.goal', 'number', '', true)}${field('Dana terkumpul', 'prep.fin.saved', 'number', '', true)}${field('Setoran per bulan', 'prep.fin.monthly', 'number', '', true)}
  </div>
  <div class="sec">Rincian biaya <small>${fmtMoney(paid)} dari ${fmtMoney(tot)} lunas</small></div><div class="card">
    ${F.costs.map((c) => `<div class="trow"><button class="task ${c.paid ? 'done' : ''}" data-act="cost" data-id="${c.id}" role="checkbox" aria-checked="${c.paid}"><span class="cb">${CHECK}</span><span class="tt">${esc(c.name)}<br><small class="muted">${fmtMoney(c.amt)}</small></span></button><button class="x" data-act="del-cost" data-id="${c.id}" aria-label="Hapus biaya">×</button></div>`).join('') || '<p class="muted" style="margin:0 0 4px">Catat biaya seperti tes bahasa, penerjemah tersumpah, legalisasi, dan biaya aplikasi.</p>'}

  </div>${vGold()}${taskBlock('fin')}`;
}

function vMental() {
  const M = data.prep.mental, td = today(), cur = M.moods.find((m) => m.d === td);
  const days = [...Array(7)].map((_, i) => { const d = new Date(); d.setDate(d.getDate() - (6 - i)); const k = ymd(d); const m = M.moods.find((x) => x.d === k); return { l: d.toLocaleDateString('id-ID', { weekday: 'short' }), v: m ? m.v : 0 }; });
  return `<div class="sec">Bagaimana perasaan Anda hari ini?</div><div class="card">
    <div class="moods">${MOODS.map(([e, t], i) => `<button data-act="mood" data-v="${i + 1}" aria-pressed="${cur && cur.v === i + 1}" aria-label="${t}">${e}<small>${t}</small></button>`).join('')}</div>
    <div class="week" aria-label="Suasana hati 7 hari terakhir">${days.map((d) => `<div><i class="${d.v ? '' : 'e'}" style="height:${d.v ? d.v * 16 : 4}px"></i>${d.l}</div>`).join('')}</div>
  </div>
  <div class="sec">Jurnal alasan dan kekhawatiran</div><div class="card">
    <label class="fld" style="margin-top:0"><span class="muted" style="font-weight:400">Tulis alasan Anda pindah, hal yang dikhawatirkan, dan hal yang ingin dijaga dari tanah air.</span><textarea data-bind="prep.mental.journal" maxlength="3000" placeholder="Mulai menulis di sini…">${esc(M.journal)}</textarea></label>
  </div>${taskBlock('mental')}
  <div class="note" style="margin-top:18px">Proses ini bisa melelahkan. Bila stres atau cemas terasa berat, bicarakan dengan orang terdekat atau tenaga profesional.</div>`;
}

document.addEventListener('submit', async (e) => {
  if (e.target.id !== 'authForm') return;
  e.preventDefault();
  const f = new FormData(e.target), email = (f.get('email') || '').trim(), pw = f.get('password') || '', nm = (f.get('name') || '').trim();
  if (!email || !pw) { authErr = 'Isi email dan kata sandi.'; return render(); }
  busy = true; authErr = ''; render();
  try {
    if (authMode === 'register') {
      const cred = await createUserWithEmailAndPassword(auth, email, pw);
      if (nm) await updateProfile(cred.user, { displayName: nm });
    } else await signInWithEmailAndPassword(auth, email, pw);
  } catch (err) { authErr = AUTH_ERR[err.code] || 'Gagal: ' + (err.code || err.message); }
  busy = false; if (!user) render();
});

document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;

    case 'cmp-food-reset': { const x0 = data.compare.cells?.[el.dataset.c]?.[el.dataset.a]; if (x0) delete x0.v; save(); render(); break; }
    case 'cmp-add-aspect': { const i = $('#cmp-new'), sv = i.value.trim(); if (!sv) return i.focus(); data.compare.aspects.push({ id: rid(), name: sv }); save(); render(); break; }
    case 'cmp-del-aspect': {
      const a = data.compare.aspects.find((x) => x.id === id); if (!a || !confirm('Hapus aspek "' + a.name + '" beserta isinya?')) return;
      data.compare.aspects = data.compare.aspects.filter((x) => x.id !== id);

    }
    case 'goto': tab = t; cid = null; csub = null; closeSheet(); render(true); break;
    case 'goto-prep': tab = 'prep'; cid = null; csub = null; ptab = p; render(true); break;
    case 'ptab': ptab = p; render(); break;
    case 'theme': data.theme = v; applyTheme(); save(); render(); break;
    case 'close': closeSheet(); break;
    case 'auth-mode': authMode = authMode === 'login' ? 'register' : 'login'; authErr = ''; render(); break;
    case 'forgot': {
      const em = ($('input[name=email]')?.value || '').trim();
      if (!em) { authErr = 'Isi email dulu, lalu ketuk "Lupa kata sandi?".'; return render(); }
      try { await sendPasswordResetEmail(auth, em); toast('Email reset dikirim. Cek kotak masuk Anda.'); } catch (err) { authErr = AUTH_ERR[err.code] || 'Gagal mengirim email.'; render(); }
      break;
    }
    case 'task': { const x = data.prep[cat].tasks.find((a) => a.id === id); x.done = !x.done; save(); render(); break; }
    case 'del-task': data.prep[cat].tasks = data.prep[cat].tasks.filter((a) => a.id !== id); save(); render(); break;
    case 'add-task': { const i = $('#new-' + cat), s = i.value.trim(); if (!s) return i.focus(); data.prep[cat].tasks.push({ id: rid(), text: s, done: false }); save(); render(); break; }
    case 'jp-open': jpv = { id, tab: 'belajar', ci: 0, guide: true, q: null }; render(true); break;
    case 'jp-close': jpv = null; render(true); break;
    case 'jp-tab': jpv.tab = v; render(); break;
    case 'jp-say': jpSay(jpL(jpv.id).items[+ix].s); break;
    case 'jp-char': jpv.ci = +ix; render(); break;
    case 'jp-guide': jpv.guide = jpv.guide === false; render(); break;
    case 'jp-clear': { const c = $('#jp-pad'); c.getContext('2d').clearRect(0, 0, c.width, c.height); break; }
    case 'jp-qstart': jpQuizStart(); render(); break;
    case 'jp-ans': { const q = jpv.q; if (q.pick !== null) return; q.pick = +ix; if (q.qs[q.i].o[q.pick] === q.qs[q.i].c) q.s++; render(); break; }
    case 'jp-next': { const q = jpv.q; q.i++; q.pick = null; if (q.i >= q.qs.length && q.s / q.qs.length >= 0.8) { data.prep.lang.jp.done[jpv.id] = true; save(); } render(); break; }
    case 'jp-done': { const D = data.prep.lang.jp.done; D[id] = !D[id]; save(); render(); break; }

      data.prep.fin.gold.items.push({ id: rid(), type: $('#gold-type').value, name: $('#gold-name').value.trim(), grams: gr, karat: $('#gold-k').value }); save(); render(); break;
    }
    case 'del-gold': data.prep.fin.gold.items = data.prep.fin.gold.items.filter((a) => a.id !== id); save(); render(); break;
    case 'add-cost': {
      const n = $('#cost-name').value.trim(), a = Number($('#cost-amt').value) || 0;

    case 'cost': { const c = data.prep.fin.costs.find((a) => a.id === id); c.paid = !c.paid; save(); render(); break; }
    case 'del-cost': data.prep.fin.costs = data.prep.fin.costs.filter((a) => a.id !== id); save(); render(); break;
    case 'goal-from-costs': data.prep.fin.goal = data.prep.fin.costs.reduce((a, c) => a + c.amt, 0); save(); render(); toast('Target dana diperbarui'); break;
    case 'mood': { const M = data.prep.mental, d = today(), x = M.moods.find((a) => a.d === d); if (x) x.v = +v; else M.moods.push({ d, v: +v }); M.moods = M.moods.slice(-90); save(); render(); break; }
    case 'add-country': sheetAdd(); break;
    case 'pick': newCountry(CATALOG.find((c) => c.k === k)); break;
    case 'pick-custom': { const n = $('#c-name').value.trim(); if (!n) return $('#c-name').focus(); newCountry({ n }); break; }
    case 'open-country': cid = id; csub = null; history.pushState({ cid: 1 }, ''); render(true); break;
    case 'open-sub': csub = sub; history.pushState({ csub: 1 }, ''); render(true); break;
    case 'back-nav': backNav(); break;
    case 'c-toggle': { const x = C()[list].find((a) => a.id === id); if (x) { x.done = !x.done; save(); render(); } break; }
    case 'c-del': { const c = C(); c[list] = c[list].filter((a) => a.id !== id); save(); render(); break; }
    case 'c-add': { const inp = $('#new-c-' + list), txt = inp.value.trim(); if (!txt) return inp.focus(); C()[list].push({ id: rid(), text: txt, done: false }); save(); render(); break; }
    case 'c-pri': { const c = C(); if (c.priority) c.priority = false; else data.countries.forEach((x) => (x.priority = x.id === c.id)); save(); render(); break; }
    case 'c-log': { const L = C().ln, d = today(), mm = +m; let e2 = L.log.find((l) => l.d === d); if (!e2) { e2 = { d, m: 0 }; L.log.push(e2); } e2.m = Math.max(0, e2.m + mm); L.log = L.log.filter((l) => l.m > 0).slice(-120); save(); render(); break; }
    case 'c-fin-add': { const ni = $('#nf-' + list + '-n'), na = $('#nf-' + list + '-a'), nm = ni.value.trim(); if (!nm) return ni.focus(); C().fin[list].push({ id: rid(), name: nm, amt: Math.max(0, Number(na.value) || 0) }); save(); render(); break; }
    case 'c-fin-del': { const F = C().fin; F[list] = F[list].filter((a) => a.id !== id); save(); render(); break; }
    case 'c-reg-add': { const ni = $('#nr-n'), nm = ni.value.trim(); if (!nm) return ni.focus(); C().regions.push({ id: rid(), name: nm, note: '', fav: false }); save(); render(); break; }
    case 'c-reg-fav': { const x = C().regions.find((a) => a.id === id); if (x) { x.fav = !x.fav; save(); render(); } break; }
    case 'c-reg-del': { const c = C(); c.regions = c.regions.filter((a) => a.id !== id); save(); render(); break; }
    case 'c-reg-sug': { const c = C(), r = (REG[catOf(c)?.k] || [])[+ix]; if (r) { c.regions.push({ id: rid(), name: r[0], note: r[1], fav: false }); save(); render(); } break; }
    case 'cmp-exit': {
      const c = data.countries.find((x) => x.id === id); if (!c) break;
      if (!confirm('Keluarkan ' + c.name + ' dari Perbandingan dan daftar Negara? Semua data negara ini ikut terhapus.')) return;
      const was = c.priority;
      data.countries = data.countries.filter((x) => x.id !== id);

      if (data.compare.cells) delete data.compare.cells[id];
      if (data.compare.jobs) delete data.compare.jobs[id];
      if (data.compare.nat) delete data.compare.nat[id];
      if (data.compare.natNote) delete data.compare.natNote[id];
      if (data.compare.cult) delete data.compare.cult[id];
      save(); toast(c.name + ' dikeluarkan'); render(); break;
    }
    case 'del-country': {
      if (!confirm('Hapus negara ini dari daftar?')) return;
      const was = data.countries.find((x) => x.id === id)?.priority;

    case 'del-account': {
      if (!confirm('Hapus akun beserta semua datanya secara permanen?')) return;

        await reauthenticateWithCredential(auth.currentUser, EmailAuthProvider.credential(user.email, pw));

  }
  if (t.dataset.cc) {
    const [cc, aa] = t.dataset.cc.split('|'), cp = data.compare; cp.cells ??= {};

  if (t.dataset.render || p === 'currency') render();
});
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredInstall = e; if (user && tab === 'settings') render(); });
addEventListener('scroll', () => document.body.classList.toggle('scrolled', scrollY > 4), { passive: true });
window.addEventListener('online', () => user && save());

/* ============================================================
   10. START
   ============================================================ */
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(() => {}));

if (!CONFIGURED) { booted = true; render(); }
else onAuthStateChanged(auth, async (u) => {
  user = u;
  if (u) { await loadData(); applyTheme(); tab = 'dashboard'; firstDash = true; }
  else { data = defaultData(); applyTheme(); }
  booted = true; render(true);
});
</script>
</body>
</html>
